name: Reset RasGram users

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DELETE to wipe all chat_users'
        required: true

permissions:
  contents: write

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install google-auth requests
      - name: Delete chat_users
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: python3 scripts/reset_rasgram_users.py
      - name: Commit result log
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add rasgram_reset_log.txt || true
          git diff --cached --quiet || (git commit -m "ci: update rasgram_reset_log.txt [skip ci]" && git pull --rebase origin main && git push)
